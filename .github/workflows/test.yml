name: test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: 离线回归 (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 只跑 Windows：package.json 声明了 "os": ["win32"]（插件用 install.ps1 装进
        # DSH desktop profile，vendor 里是 adb.exe / AdbWinApi.dll，本来就只有 Windows 版），
        # 在 linux runner 上 `npm install` 会直接 EBADPLATFORM 退出，跑了也没有意义。
        os: [windows-latest]
        # 只跑 22 / 24：测试依赖 jsdom 依赖的 undici 需要 zlib.createZstdDecompress，
        # 那是 Node 22.15+ 才有的 API，Node 20 上 jsdom 加载即失败。
        # （插件的运行时代码本身零 npm 依赖，Node ≥ 20 即可。）
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 只装离线测试用的 devDependencies（react / react-dom / jsdom）；
      # 插件的运行时不依赖任何 npm 包，peerDependencies 里的 dsh-better-sidebar 是 optional。
      - name: 安装测试依赖
        run: npm install --no-audit --no-fund

      - name: 离线回归（不需要真机）
        run: npm test

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.os }}-node${{ matrix.node }}
          path: test/reports/
          if-no-files-found: ignore
